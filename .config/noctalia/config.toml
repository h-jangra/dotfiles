config_version = 14

[bar.default]
background_opacity = 0.0
capsule = true
capsule_fill = "#242436"
capsule_group = []
capsule_radius = 4
center = [ "workspaces" ]
end = [ "tray", "bluetooth", "network", "volume", "battery", "session" ]
font_family = "Maple Mono NF"
margin_edge = 0
margin_ends = 0
scale = 1.1000000000000001
start = [ "clock", "sysmon_3", "widget_2", "widget_3" ]
widget_spacing = 3

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
radius = 4

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.00006103515625
    cy = 672.50006103515625
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
privacy = false

[plugin_settings."h-jangra/keyviz"]
badge_style = "accent"
display_mode = "overlay"
enabled_by_default = false
margin_horizontal = 10
max_keys = 3
overlay_height = 32
overlay_position = "bottom_left"
overlay_width = 160

[plugin_settings."h-jangra/region-recorder"]
audio_source = "both"

[plugin_settings."hj/aur"]
helper = "yay"

[plugin_settings."omarchy/aur"]
helper = "yay"
panel_placement = "attached"

[plugins]
auto_update = "all"
enabled = [ "omarchy/aur", "hj/aur", "h-jangra/region-recorder", "h-jangra/keyviz" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/Projects/noc"
    name = "local"

[shell]
button_borders = false
card_borders = false
clipboard_image_action_command = "satty -f -"
corner_radius_scale = 0.5000000074505806
input_borders = false
launch_apps_as_systemd_services = true
polkit_agent = true
popup_borders = false
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    clipboard_placement = "attached"
    list_item_background = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
custom_palette = "MyPalette"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]
    community_ids = [ "zen-browser" ]

[wallpaper.automation]
enabled = true

[wallpaper.default]
path = "/home/hj/Pictures/Wallpapers/wallhaven-vpd2jp.jpg"

[wallpaper.last]
path = "/home/hj/Pictures/Wallpapers/wallhaven-vpd2jp.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/hj/Pictures/Wallpapers/wallhaven-vpd2jp.jpg"

[widget.battery]
color = "#79BFCE"
hide_when_full = true

[widget.bluetooth]
color = "#B192DA"
hide_when_no_connected_device = false

[widget.clock]
color = "#F5C2E7"
format = "{:%a %-I:%M %p}"
tooltip_format = "{:%A · %B %d, %Y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "#F9E2AF"

[widget.notifications]
color = "secondary"

[widget.session]
color = "#F38BA7"

[widget.spacer_1]
type = "spacer"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
color = "#CBA6F7"
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.temp]
show_value = false

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "#EBA0AC"

[widget.widget_2]
type = "h-jangra/keyviz:widget"

[widget.widget_3]
type = "h-jangra/region-recorder:widget"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
empty_color = "#89DCEB"
focused_color = "#B4BEFE"
inactive_pill_size = 1.0
occupied_color = "#B090D7"
pill_scale = 0.80000000000000004
show_labels = false
urgent_color = "#D894A1"

